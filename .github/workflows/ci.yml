name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run both even if one fails: Windows-specific behaviour (paths, process trees) matters here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # UI smoke tests (API mocked in the page). Chromium only, Linux only: the layout does not
      # depend on the OS and the browser download is slow on Windows runners.
      - if: runner.os == 'Linux'
        run: pnpm --filter @squadboard/web exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: pnpm --filter @squadboard/web test:e2e
